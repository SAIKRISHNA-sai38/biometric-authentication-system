<!DOCTYPE html>
<html>

<body style="text-align:center; margin-top:100px; background:#141e30; color:white;">

<h1>Login</h1>

<form id="loginForm" action="/login" method="post" enctype="multipart/form-data">

<input name="username" placeholder="Username"><br><br>

<input name="password" type="password" placeholder="Password"><br><br>
<input type="file" name="bioimage"><br><br>

<p>Type this sentence:</p>

<b>secure login system</b><br><br>

<input id="typingBox" autocomplete="off"><br><br>

<input type="hidden" name="typingData" id="typingData">
<input type="hidden" name="mouseData" id="mouseData">

<button type="submit">Login</button>

</form>

<br>

<a href="/register" style="color:white;">New User? Register</a>

<script>

let timings = [];
let lastTime = null;

document.getElementById("typingBox").addEventListener("keydown", function(){

    let now = Date.now();

    if(lastTime != null){
        timings.push(now - lastTime);
    }

    lastTime = now;
});

let mouseMoves = 0;

document.addEventListener("mousemove", function(){
    mouseMoves++;
});

document.getElementById("loginForm").addEventListener("submit", function(){

    document.getElementById("typingData").value =
        JSON.stringify(timings);

    document.getElementById("mouseData").value =
        mouseMoves;
});
window.onload = function(){

    document.getElementById("typingBox").value = "";

    timings = [];

    mouseMoves = 0;
}


</script>

</body>
</html>
